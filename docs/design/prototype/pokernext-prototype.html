MODALS.invite=()=>({title:'邀請工作帳號',body:`<div class="field"><label>Email</label><input class="input" data-bind="inv_email" placeholder="name@pokernext.example"></div><div class="field"><label>角色／職能</label><select class="input" data-bind="inv_role"><option>管理者</option><option>客服</option><option>銷售</option><option>Host／接待</option><option>Travel／Hotel Coordinator</option><option>Finance</option><option>Audit</option><option>外部 Agent</option><option>Agent Manager</option><option>天城 Venue User</option></select></div><div class="hint">7 天單次邀請；首次登入設定密碼＋TOTP。沒有 Driver 角色。</div>`,ok:{act:'invite',p:{},label:'送出邀請'}});
ACT.invite=()=>{ S.invites.push({email:sel('inv_email')||'new@pokernext.example',role:sel('inv_role')||'管理者',sent:nowStamp(),expires:'2026/09/18 '+NOW,status:'pending'}); audit('Mingyao','Platform admin',`邀請工作帳號 ${sel('inv_email')||'new@pokernext.example'}（${sel('inv_role')||'管理者'}）`); S.ui.modal=null; toast('邀請已送出，7 天內有效'); };
ACT.executeTransfer=p=>{ const x=S.transfers.find(t=>t.id===p.id); x.status='executed'; x.executedAt=nowStamp(); const c=S.customers.find(c=>x.customer.startsWith(c.name)); if(c){ c.owner=x.to; c.ownerUntil='2027/03/11'; c.last=TODAY+' · 歸屬轉派至 '+x.to; } audit('Mingyao','Platform admin',`執行歸屬轉派 ${x.id}（→ ${x.to}）`); toast('已執行；原歸屬人失去現行存取，B 可讀完整跟進歷史'); };

/* ================= 員工端（Host／接待，手機） ================= */
const STAFF_ME='Amy';
PAGES.staff={
  tasks(id){
    const mine=S.tasks.filter(t=>t.assignee===STAFF_ME);
    if(id){ const t=mine.find(x=>x.id===id); if(t) return appHead()+taskDetail(t); }
    const f=tab('stk','open'); const list=mine.filter(t=>f==='all'||t.status===f).sort((a,b)=>(a.due||a.done)<(b.due||b.done)?-1:1);
    return appHead()+`<div class="mpage"><h1>我的任務</h1><div class="hint">${TODAY} · 被指派任務依期限排序；完成依據來自正式來源。</div>${seg('stk',[['open','進行中'],['done','已完成'],['all','全部']],'open')}<div class="list tasklist" style="border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden">${list.length?list.map(t=>`<button class="li" data-act="goto" data-p='${esc(JSON.stringify({role:'staff',page:'tasks',id:t.id}))}'><div class="t"><span>${badge(t.tpl,'neutral')} ${esc(t.title)}</span>${t.status==='done'?badge('已完成','success'):badge('待回報','warning')}</div><div class="m">${t.uuid?esc(member(t.uuid).name):esc(t.customer||'')}</div><div class="b"><span class="mono">${t.tripId||t.id}</span><span>${t.status==='done'?'完成 '+t.done.slice(5):'期限 '+t.due.slice(5)}</span></div></button>`).join(''):empty('沒有任務','指派給您的任務會出現在這裡。')}</div></div>`;
  },
  customers(){
    const ts=S.trips.filter(t=>t.host===STAFF_ME&&!['cancelled','archived','settled'].includes(t.stage));
    return appHead()+`<div class="mpage"><h1>我的客戶</h1><div class="hint">只看指派行程的必要資訊；任務結束後不持續開放。</div>${ts.map(t=>{const m=member(t.uuid);return `<div class="mcard"><div class="mh"><span>${esc(m.name)}</span>${stageBadge(t.stage)}</div>${kv([['行程',`<span class="mono">${t.id}</span> · ${t.cin.slice(5)}–${t.cout.slice(5)}`],['酒店',esc(t.hotel.name)+(t.hotelCheckin?' · 已入住':' · 未入住')],['接機',t.pickup.arr.status==='none'?'自行前往':`${esc(t.pickup.arr.flight)} ${esc(t.pickup.arr.time.slice(11)||'')}${t.pickup.arr.car?' · '+esc(t.pickup.arr.car):' · 車輛待安排'}`],['押金',t.deposit.due===0?'無須':t.deposit.collected?'已收取':'待收取 '+krw(t.deposit.due)+'（天城）'],['工作聯絡','LINE 工作帳號（不顯示私人號碼）']],true)}<div style="margin-top:10px;display:flex;gap:8px">${A('noop',{},'聯繫','btn secondary sm')}${A('goto',{role:'staff',page:'tasks'},'相關任務','btn secondary sm')}</div></div>`;}).join('')||empty('目前沒有指派客戶','')}</div>`;
  },
  today(){
    const ts=S.trips.filter(t=>t.host===STAFF_ME&&(t.cin===TODAY||t.hotelCheckin&&!t.hotelCheckout));
    return appHead()+`<div class="mpage"><h1>今日接待</h1>${ts.map(t=>{const m=member(t.uuid);return `<div class="mcard"><div class="mh"><span>${esc(m.name)}</span><span class="mono mini">${t.id}</span></div><div class="mtimeline">${[[t.pickup.arr.status==='done'?'done':'todo','接機 '+esc(t.pickup.arr.time.slice(11)||'—'),t.pickup.arr.terminal||''],[t.hotelCheckin?'done':'todo','酒店入住',t.hotelCheckin||'待回報'],[t.venueCheckin?'done':'todo','PokerRoom 報到',t.venueCheckin||'引導至櫃檯'],[t.deposit.due===0?'done':t.deposit.collected?'done':'todo','押金（天城收）',t.deposit.due===0?'無須':t.deposit.collected?'已收':krw(t.deposit.due)]].map(x=>`<div class="mtl" style="${x[0]==='done'?'':'opacity:.7'}"><div>${x[1]}<small>${esc(x[2])}</small></div></div>`).join('')}</div></div>`;}).join('')||empty('今日沒有接待','')}</div>`;
  },
};
function taskDetail(t){
  const tpl=TPL[t.tpl]; const tr=t.tripId&&trip(t.tripId); const m=t.uuid&&member(t.uuid);
  const ans=sel('ans_'+t.id);
  const src=tr?[['酒店入住',tr.hotelCheckin?'已入住 '+tr.hotelCheckin:'尚無回報'],['PokerRoom 報到',tr.venueCheckin?'已報到 '+tr.venueCheckin:'尚無'],['接機',tr.pickup.arr.status==='done'?'已接到':tr.pickup.arr.car?'車輛已安排':'待安排']]:[];
  return `<div class="mpage"><a href="#/staff/tasks" class="btn ghost" style="align-self:flex-start;padding:0">‹ 我的任務</a><h1>${badge(t.tpl,'gold')} ${esc(tpl.name)}</h1>
    <div class="mcard"><div class="mh"><span>客戶與業務參照</span></div>${kv([['客戶',m?esc(m.name):esc(t.customer||'')],['行程',t.tripId?`<span class="mono">${t.tripId}</span>`:'—'],['住宿單',tr?`<span class="mono">${tr.hotel.conf}</span>`:'—'],['期限',t.due||'—']],true)}</div>
    ${src.length?`<div class="mcard"><div class="mh"><span>來源狀態／既有回報</span></div>${kv(src,true)}</div>`:''}
    ${t.status==='done'?`<div class="mcard" style="border-color:var(--success)"><div class="mh"><span>已完成</span>${badge(t.answer,'success')}</div><div class="mini">${t.done} · ${esc(t.assignee)}${t.detail?' · '+esc(t.detail):''}</div></div>`:`
    <div class="mcard"><div class="mh"><span>固定回答</span></div><div class="radio">${tpl.opts.map(o=>`<label><input type="radio" name="ans_${t.id}" value="${esc(o)}" data-bind="ans_${t.id}" data-rerender="1" ${ans===o?'checked':''}> ${esc(o)}</label>`).join('')}</div>
      ${ans?`<div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">${(ans===tpl.opts[0]?tpl.fields:['下一步','下次跟進時間']).map((f,i)=>`<div class="field"><label>${esc(f)}${ans===tpl.opts[0]?' *':''}</label><input class="input" data-bind="f${i}_${t.id}" value="${esc(sel('f'+i+'_'+t.id)||(i===0&&ans===tpl.opts[0]?TODAY+' '+NOW:''))}"></div>`).join('')}<div class="field"><label>補充說明／附件</label><textarea class="input" data-bind="memo_${t.id}" style="min-height:64px"></textarea></div></div>`:''}
    </div>${A('submitTask',{id:t.id},'提交回報','btn m block'+(ans?'':' disabled'))}<div class="hint">送出一次回答不等於完成；肯定回答必填實際時間及來源。</div>`}
  </div>`;
}
ACT.submitTask=p=>{ const t=S.tasks.find(x=>x.id===p.id); const ans=sel('ans_'+t.id); if(!ans) return false; const tpl=TPL[t.tpl]; const positive=ans===tpl.opts[0]; const tr=t.tripId&&trip(t.tripId); const f0=sel('f0_'+t.id)||nowStamp();
  if(positive){ t.status='done'; t.answer=ans; t.done=nowStamp(); t.detail=f0;
    if(tr){ if(t.tpl==='T05'){ tr.pickup.arr.status='done'; hist(tr,STAFF_ME,'接待回報：已接到本人 '+f0); }
      if(t.tpl==='T06'){ tr.hotelCheckin=f0; if(['confirmed','arrived'].includes(tr.stage)) tr.stage='checked_in'; hist(tr,STAFF_ME,'接待回報：酒店已入住 '+f0); }
      if(t.tpl==='T07'){ hist(tr,STAFF_ME,'接待回報：已引導至櫃檯 '+f0); }
      if(t.tpl==='T10'){ tr.hotelCheckout=f0; tr.stage='checked_out'; hist(tr,STAFF_ME,'接待回報：已實際退房 '+f0+'（營運已離境）'); }
      if(t.tpl==='T11'){ tr.pickup.dep.status='done'; hist(tr,STAFF_ME,'接待回報：已送達機場 '+f0); }
      if(t.tpl==='T13'){ hist(tr,STAFF_ME,'接待回報：已提醒本人操作結算'); }
    }
    audit(STAFF_ME,'Host',`${t.id} ${tpl.name}：${ans}`); toast('已回報：'+ans+(t.tpl==='T06'?'；在島玩家已更新':t.tpl==='T10'?'；管理端可開放結算':''));
  } else { t.lastAnswer=ans; t.lastAt=nowStamp(); if(tr) hist(tr,STAFF_ME,`接待回報：${ans}`); audit(STAFF_ME,'Host',`${t.id} ${tpl.name}：${ans}（持續追蹤）`); toast('已記錄，任務持續追蹤'); }
  go('staff','tasks'); return true; };

/* ================= Agent端 ================= */
const AGENT_ME='David Chen';
PAGES.agent={
  customers(id){
    const mine=S.customers.filter(c=>c.owner===AGENT_ME);
    const c=id?mine.find(x=>x.id===id):null; if(c) return customerDetail(c,'agent');
    return pageHead('名下客戶','只看本人名下客戶與本人業績；不得操作非名下行程。',A('openModal',{m:'newLead'},'建立 Lead','btn secondary'))+`<div class="kpis"><div class="kpi">${I.users}<div><div class="l">名下客戶</div><div class="v">${String(mine.length).padStart(2,'0')}</div></div></div><div class="kpi">${I.briefcase}<div><div class="l">進行中行程</div><div class="v">${String(mine.filter(x=>x.phase==='trip').length).padStart(2,'0')}</div></div></div><div class="kpi">${I.chat}<div><div class="l">售前跟進中</div><div class="v">${String(mine.filter(x=>x.phase==='presale').length).padStart(2,'0')}</div></div></div><div class="kpi">${I.clock}<div><div class="l">歸屬 30 天內到期</div><div class="v">00</div></div></div></div>
      <div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>客戶</th><th>階段</th><th>售前進度</th><th>歸屬期限</th><th>最近紀錄</th><th></th></tr></thead><tbody>${mine.map(x=>`<tr class="row"><td>${esc(x.name)}</td><td>${badge({presale:'售前',trip:'行程服務',maintain:'維護'}[x.phase],{presale:'warning',trip:'info',maintain:'neutral'}[x.phase])}</td><td>${PRESALE[x.presale]}</td><td>${x.ownerUntil}</td><td class="mini">${esc(x.last)}</td><td><div style="display:flex;gap:8px">${A('goto',{role:'agent',page:'customers',id:x.id},'詳情','btn secondary sm')}${x.phase==='presale'?A('openModal',{m:'followup',id:x.id},'跟進','btn secondary sm'):''}</div></td></tr>`).join('')}</tbody></table></div></div>`;
  },
  followup(){
    const mine=S.customers.filter(c=>c.owner===AGENT_ME&&c.phase==='presale');
    return pageHead('Engagement 跟進工作頁','五種固定狀態、聯繫摘要、輪次／下一步同頁。轉派後歷史不覆寫。')+`<div class="grid2">${mine.map(c=>{const fus=S.followups.filter(f=>f.cust===c.id);return `<div class="card"><div class="chead"><h3>${esc(c.name)}</h3>${badge(PRESALE[c.presale],'gold')}</div><div class="cbody">${fus.length?fus.slice(-2).map(f=>`<div class="row" style="padding:8px 0"><div class="g"><b>${esc(f.sum)}</b><small>${f.t} · ${esc(f.ch)} · 下一步：${esc(f.next)}</small></div></div>`).join(''):'<div class="mini">尚無跟進</div>'}<div style="display:flex;gap:10px;margin-top:14px">${A('openModal',{m:'followup',id:c.id},'新增跟進','btn secondary')}${c.presale==='INTENT_PRESENT'?A('openModal',{m:'hostReq',id:c.id},'申請代接待'):''}</div></div></div>`;}).join('')||empty('沒有售前中的客戶','')}</div>`;
  },
  hosting(){
    const mine=S.hostRequests.filter(h=>h.agent===AGENT_ME);
    return pageHead('代接待申請','歸屬人提出需求，由管理者指派服務人；歸屬不變。',A('openModal',{m:'hostReq',id:null},'新增申請'))+`<div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>申請</th><th>客戶</th><th>需求</th><th>指派服務人</th></tr></thead><tbody>${mine.map(h=>`<tr><td class="mono">${h.id}<span class="sub">${h.t}</span></td><td>${esc(h.customer)}</td><td>${esc(h.want)}</td><td>${h.assignee?dot(h.assignee,'success'):dot('待管理者指派','warning')}</td></tr>`).join('')||'<tr><td colspan="4">尚無申請</td></tr>'}</tbody></table></div></div>`;
  },
  performance(){
    const rows=[['2026/08','LIN, MAY','TR-260820-011',18400,'v3 · KRW 40／分','已支付 9/05'],['2026/08','KIM, JISOO','TR-260812-004',9600,'v3','已支付 9/05'],['2026/09','LIN, MAY','TR-260911-029',S.pointsImport.status==='approved'?6200:0,'v3',S.pointsImport.status==='approved'?'已入帳，待月結':'來源未入帳'],['2026/09','CHEN, ALEX','TR-260911-028',S.pointsImport.status==='approved'?5500:0,'v3',S.pointsImport.status==='approved'?'已入帳，待月結':'來源未入帳']];
    return pageHead('本人業績與獎金結算','依活動日期的歸屬及個人適用單價計算；只看本人，不看全公司或他人獎金。')+`<div class="kpis"><div class="kpi">${I.coins}<div><div class="l">9 月名下新增積分</div><div class="v">${pts(rows.filter(r=>r[0]==='2026/09').reduce((a,r)=>a+r[3],0))}</div></div></div><div class="kpi">${I.chart}<div><div class="l">8 月已結算</div><div class="v">${pts(28000)}</div></div></div><div class="kpi">${I.wallet}<div><div class="l">8 月獎金（已支付）</div><div class="v" style="font-size:24px">KRW 1,120,000</div></div></div><div class="kpi">${I.clock}<div><div class="l">待本人確認明細</div><div class="v">00</div></div></div></div>
      <div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>月份</th><th>客戶</th><th>行程</th><th>入帳積分</th><th>單價版本</th><th>狀態</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td class="mono">${r[2]}</td><td class="num" style="font-weight:400">${pts(r[3])}</td><td>${r[4]}</td><td>${r[5].startsWith('已支付')?dot(r[5],'success'):r[5].startsWith('已入帳')?dot(r[5],'info'):dot(r[5],'neutral')}</td></tr>`).join('')}</tbody></table></div><div class="cfoot"><span>個人單價實際值仍待定（PRD 15.4）</span><span>匯出：僅本人結算單</span></div></div>`;
  },
};
MODALS.hostReq=p=>{const c=p.id&&S.customers.find(x=>x.id===p.id);return {title:'申請代接待',body:`<div class="field"><label>客戶</label><input class="input" data-bind="hr_c" value="${esc(c?c.name:'')}" placeholder="名下客戶"></div><div class="field"><label>需求</label><textarea class="input" data-bind="hr_want" placeholder="日期、是否需接機、特別需求"></textarea></div><div class="hint">歸屬仍是您；服務人只按任務存取必要資料。</div>`,ok:{act:'hostReq',p:{},label:'送出申請'}};};
ACT.hostReq=()=>{ const id='HR-00'+(89+S.hostRequests.length); S.hostRequests.push({id,customer:sel('hr_c')||'名下客戶',agent:AGENT_ME,want:sel('hr_want')||'',t:nowStamp(),status:'pending',assignee:null}); audit(AGENT_ME,'Agent',`提出代接待申請 ${id}`); S.ui.modal=null; toast('已送出，等待管理者指派'); };

/* ---------- boot ---------- */
load(); if(!location.hash) location.hash='#/player/home'; render();
</script>
