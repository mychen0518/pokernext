<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>POKERNEXT 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --bg:#0b0c0d;--surface:#121314;--surface-2:#1a1c1e;--surface-3:#202325;--border:#25292d;--border-strong:#393c3f;
  --text:#f2f2f2;--text-2:#a0a2a9;--text-3:#6a6c72;--text-inverse:#141418;
  --gold:#c8a86f;--gold-bright:#e7c076;--gold-dim:#9c8758;--gold-tint:#23211b;
  --success:#5e9f6c;--success-tint:#17211a;--warning:#e3bd69;--warning-tint:#26221a;--danger:#c0716f;--danger-tint:#291d1f;--info:#7c95c9;--info-tint:#191f2d;--neutral:#8b8e95;--neutral-tint:#1d1f20;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--serif:"Noto Serif TC","Songti TC",Georgia,serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-sm:4px;--r-md:6px;--r-lg:8px;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold-bright)}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
.mono{font-family:var(--mono);font-size:.93em}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums;font-weight:700}
.muted{color:var(--text-2)}.faint{color:var(--text-3)}
.overline{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold-dim);font-weight:500}
.label{font-size:12px;color:var(--text-3);line-height:1.4}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- role switcher / demo chrome ---------- */
.rolebar{position:fixed;top:12px;left:12px;z-index:60;display:flex;gap:8px;align-items:center}
.rolebar .pill{display:flex;align-items:center;gap:8px;background:var(--surface-3);border:1px solid var(--border-strong);border-radius:999px;padding:6px 14px 6px 10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.rolebar .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.rolebar .pill b{font-weight:600}
.rolemenu{position:fixed;top:52px;left:12px;z-index:60;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r-lg);padding:6px;min-width:280px;box-shadow:0 16px 40px rgba(0,0,0,.6)}
.rolemenu button{display:flex;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:var(--r-md);gap:12px;align-items:center}
.rolemenu button:hover{background:var(--surface-3)}
.rolemenu button.on{background:var(--gold-tint);color:var(--gold-bright)}
.rolemenu .who{display:flex;flex-direction:column;line-height:1.3}
.rolemenu .who small{color:var(--text-3);font-size:12px}
.rolemenu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.scriptbtn{position:fixed;right:16px;bottom:16px;z-index:60;background:var(--gold);color:var(--text-inverse);border:0;border-radius:999px;padding:10px 18px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.script{position:fixed;right:16px;bottom:64px;z-index:60;width:min(420px,calc(100vw - 32px));max-height:min(70vh,640px);overflow:auto;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r-lg);box-shadow:0 16px 40px rgba(0,0,0,.6);padding:16px 18px}
.script h3{font-size:16px;margin-bottom:4px}
.script ol{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.script li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface)}
.script li.done{border-color:rgba(94,159,108,.4)}
.script li .k{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;font-size:11px;color:var(--text-3)}
.script li.done .k{background:var(--success);border-color:var(--success);color:#0b0c0d}
.script li .t{font-size:13px;line-height:1.45}
.script li .t small{display:block;color:var(--text-3);font-size:12px}
.script li button{background:none;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:2px 8px;font-size:12px;color:var(--gold-bright);white-space:nowrap}
.toasts{position:fixed;top:14px;right:16px;z-index:70;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface-3);border:1px solid var(--border-strong);border-left:3px solid var(--success);border-radius:var(--r-md);padding:10px 14px;font-size:13px;min-width:260px;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:in .2s ease}
.toast.warn{border-left-color:var(--warning)}.toast.err{border-left-color:var(--danger)}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---------- desktop workspace shell ---------- */
.ws{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.sidebar{background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:72px 24px 20px}
.brand .logo{font-size:18px;font-weight:700;letter-spacing:.18em}
.brand .logo span{color:var(--gold-bright)}
.brand .sub{font-size:13px;color:var(--text-2);margin-top:2px}
.nav{display:flex;flex-direction:column}
.nav a{display:flex;align-items:center;gap:14px;padding:0 24px;height:56px;color:var(--text);text-decoration:none;border-left:3px solid transparent;font-size:15px}
.nav a svg{width:22px;height:22px;stroke:var(--text-2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{background:var(--gold-tint);border-left-color:var(--gold);color:var(--gold-bright)}
.nav a.on svg{stroke:var(--gold-bright)}
.nav a:hover:not(.on){background:var(--surface)}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.nav a.on .cnt{color:var(--gold-dim)}
.sidefoot{margin-top:auto;padding:18px 24px;border-top:1px solid var(--border);font-size:13px}
.sidefoot .name{font-weight:600}
.sidefoot .role{color:var(--text-3);font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-2)}
.topbar .overline{color:var(--gold-dim)}
.page{padding:28px 32px 48px;display:flex;flex-direction:column;gap:24px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
.ph h1{font-size:28px;line-height:1.3}
.ph p{margin:4px 0 0;color:var(--text-2)}
.ph .actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- components ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:var(--r-md);border:1px solid transparent;font-weight:600;font-size:15px;background:var(--gold);color:var(--text-inverse);white-space:nowrap;transition:filter .12s}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.secondary{background:transparent;border-color:var(--border-strong);color:var(--text)}
.btn.outline-gold{background:transparent;border-color:var(--gold);color:var(--gold-bright)}
.btn.ghost{background:none;border-color:transparent;color:var(--gold-bright);padding:0 6px;height:auto}
.btn.danger{background:transparent;border-color:var(--border-strong);color:var(--danger)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)}
.card.pad{padding:24px}
.card.el{background:var(--surface-2)}
.chead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--border)}
.chead h3{font-size:18px}
.cbody{padding:24px}
.cfoot{padding:14px 24px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.kpi{display:flex;gap:16px;align-items:center;padding:20px 24px;border-right:1px solid var(--border)}
.kpi:last-child{border-right:0}
.kpi svg{width:32px;height:32px;stroke:var(--gold-bright);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.kpi .l{font-size:13px;color:var(--text-2)}
.kpi .v{font-family:var(--serif);font-size:32px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.dot{display:inline-flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.dot.success{color:var(--success)}.dot.warning{color:var(--warning)}.dot.danger{color:var(--danger)}.dot.info{color:var(--info)}.dot.neutral{color:var(--neutral)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--r-sm);font-size:12px;border:1px solid currentColor;white-space:nowrap;line-height:1}
.badge.success{color:var(--success);background:var(--success-tint)}.badge.warning{color:var(--warning);background:var(--warning-tint)}.badge.danger{color:var(--danger);background:var(--danger-tint)}.badge.info{color:var(--info);background:var(--info-tint)}.badge.neutral{color:var(--neutral);background:var(--neutral-tint)}.badge.gold{color:var(--gold-bright);background:var(--gold-tint)}
.tabs{display:flex;border-bottom:1px solid var(--border);gap:4px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;height:48px;padding:0 20px;color:var(--text-2);font-size:15px;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--gold-bright);border-bottom-color:var(--gold)}
.tabs button .c{font-size:13px;margin-left:6px;color:var(--text-3)}
.tabs button.on .c{color:var(--gold-dim)}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r-md);color:var(--text-3)}
.search input{flex:1;background:none;border:0;outline:none;color:var(--text);min-width:0}
.search svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-weight:400;font-size:13px;color:var(--text-2);background:var(--surface-2);padding:0 16px;height:44px;white-space:nowrap}
.tbl td{padding:12px 16px;border-top:1px solid var(--border);vertical-align:middle}
.tbl tr.row:hover td{background:var(--surface-3)}
.tbl tr.sel td{background:var(--gold-tint)}
.tbl td .sub{display:block;font-size:13px;color:var(--text-2)}
.tbl td:first-child{font-weight:600;white-space:nowrap}
.tblwrap{overflow-x:auto}
.kv{display:flex;flex-direction:column}
.kv > div{display:grid;grid-template-columns:160px 1fr;gap:16px;min-height:40px;align-items:center;border-bottom:1px solid var(--border);padding:6px 0}
.kv > div:last-child{border-bottom:0}
.kv .k{color:var(--text-2);font-size:14px}
.kv .v{font-size:15px;word-break:break-all}
.kv.stack > div{grid-template-columns:1fr;gap:2px;min-height:auto;border:0;padding:2px 0}
.kv.stack .k{font-size:12px;color:var(--text-3)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--text-2)}
.input,select.input,textarea.input{height:48px;padding:0 14px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r-md);color:var(--text);width:100%;outline:none}
textarea.input{height:auto;min-height:96px;padding:12px 14px;resize:vertical}
.input:focus{border-color:var(--gold)}
.prefix{display:flex;align-items:stretch}
.prefix span{display:flex;align-items:center;padding:0 14px;border:1px solid var(--border-strong);border-right:0;border-radius:var(--r-md) 0 0 var(--r-md);color:var(--text-2);background:var(--surface-2)}
.prefix .input{border-radius:0 var(--r-md) var(--r-md) 0}
.check{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:15px}
.check input{appearance:none;width:20px;height:20px;border:1.5px solid var(--border-strong);border-radius:var(--r-sm);display:grid;place-items:center;margin:0;flex:none}
.check input:checked{background:var(--gold);border-color:var(--gold)}
.check input:checked::after{content:"";width:6px;height:10px;border:solid var(--text-inverse);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.banner{display:flex;align-items:center;gap:16px;padding:0 20px;height:56px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)}
.banner .st{display:flex;align-items:center;gap:10px;font-weight:600}
.banner .st svg{width:22px;height:22px}
.banner .sep{width:1px;height:24px;background:var(--border)}
.banner .r{margin-left:auto}
.info{display:flex;gap:12px;padding:14px 16px;background:var(--surface-2);border-radius:var(--r-md);font-size:14px}
.info svg{width:20px;height:20px;stroke:var(--text-2);fill:none;stroke-width:1.6;flex:none;margin-top:2px}
.info b{display:block;font-weight:600}
.info span{color:var(--text-2);font-size:13px}
.amount{display:flex;align-items:baseline;gap:8px}
.amount .cur{font-size:15px;color:var(--text-2)}
.amount .v{font-family:var(--serif);font-size:32px;font-weight:700;color:var(--gold-bright);font-variant-numeric:tabular-nums;line-height:1.1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.grid2>*,.grid32>*,.grid13>*,.ws>*,.main{min-width:0}
.tbl td .mono,.tbl td.mono{white-space:nowrap}
.grid32{display:grid;grid-template-columns:2fr 1fr;gap:24px;align-items:start}
.grid13{display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:start}
.list{display:flex;flex-direction:column}
.li{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border);border-left:3px solid transparent;padding:16px 18px;color:var(--text);position:relative}
.li:hover{background:var(--surface-3)}
.li.on{background:var(--gold-tint);border-left-color:var(--gold)}
.li .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px;font-weight:600}
.li .m{font-size:14px;margin-top:2px}
.li .b{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-top:2px}
.stepper{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:relative;margin:12px 0 4px}
.step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;position:relative;font-size:13px}
.step .n{width:24px;height:24px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;background:var(--surface);z-index:1;font-size:12px;color:var(--text-3)}
.step.done .n{background:var(--gold);border-color:var(--gold);color:var(--text-inverse)}
.step.cur .n{border-color:var(--gold);color:var(--gold-bright)}
.step::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--border-strong);border-top:2px dashed var(--border-strong);background:none}
.step.done::before,.step.cur::before{border-top:2px solid var(--gold)}
.step:first-child::before{display:none}
.step small{display:block;color:var(--text-3);font-size:12px}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:14px 64px 120px 150px 1fr;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;position:relative}
.tl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--success);margin-left:3px}
.tl .tm{font-size:13px;font-weight:600}
.tl .ev{font-weight:600}
.tl .ds{color:var(--text-2);font-size:13px}
.todo{display:flex;flex-direction:column;gap:16px}
.todo .card{padding:18px}
.todo .th{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;margin-bottom:8px}
.todo .th svg{width:22px;height:22px;stroke:var(--gold-bright);fill:none;stroke-width:1.6}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:200px;padding:32px;text-align:center;color:var(--text-2)}
.empty svg{width:32px;height:32px;stroke:var(--text-3);fill:none;stroke-width:1.4}
.empty b{color:var(--text);font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-lg);width:min(560px,100%);box-shadow:0 8px 32px rgba(0,0,0,.6);max-height:92vh;overflow:auto}
.modal .mh{padding:20px 24px;border-bottom:1px solid var(--border);font-size:18px;font-weight:600}
.modal .mb{padding:24px;display:flex;flex-direction:column;gap:16px}
.modal .mf{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.split > div{background:var(--surface-2);padding:14px 18px}
.split .k{font-size:13px;color:var(--gold-dim)}
.split .v{font-size:16px;margin-top:2px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pillb{background:none;border:1px solid var(--border-strong);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--text-2)}
.pillb.on{border-color:var(--gold);color:var(--gold-bright);background:var(--gold-tint)}
.radio{display:flex;flex-direction:column;gap:8px}
.radio label{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer}
.radio label:has(input:checked){border-color:var(--gold);background:var(--gold-tint)}
.radio input{accent-color:var(--gold)}
.mini{font-size:13px;color:var(--text-2)}
.diffrow.add td{color:var(--success)}.diffrow.fix td{color:var(--warning)}.diffrow.miss td{color:var(--danger)}
.qr{width:200px;height:200px;margin:0 auto;display:grid;grid-template-columns:repeat(21,1fr);gap:1px;background:#fff;padding:10px;border-radius:var(--r-md)}
.qr i{display:block;background:#fff}.qr i.b{background:#111}

/* ---------- phone shell ---------- */
.phonewrap{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:72px 16px 32px;background:radial-gradient(ellipse at top,#141517,var(--bg) 60%)}
.phone{width:430px;max-width:100%;min-height:860px;background:var(--bg);border:1px solid var(--border-strong);border-radius:32px;position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column}
.phone .screen{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:88px}
.apphead{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 8px}
.apphead .logo{font-size:15px;font-weight:700;letter-spacing:.2em}
.apphead .logo span{color:var(--gold-bright)}
.apphead .tag{font-size:9px;letter-spacing:.3em;color:var(--text-3)}
.apphead .bell{position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.apphead .bell svg{width:24px;height:24px;stroke:var(--text);fill:none;stroke-width:1.6}
.apphead .bell i{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--gold-bright);border-radius:50%}
.hero{position:relative;padding:20px 24px 28px;overflow:hidden;min-height:380px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.hero .bgart{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 40% at 70% 80%,rgba(200,168,111,.35),transparent 60%),
  radial-gradient(ellipse 80% 50% at 30% 20%,rgba(59,84,140,.45),transparent 70%),
  linear-gradient(180deg,#1b2233 0%,#0e1119 45%,#0b0c0d 100%)}
.hero .bgart::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(180deg,transparent,rgba(11,12,13,.95))}
.hero .skyline{position:absolute;left:0;right:0;bottom:120px;height:90px;opacity:.55}
.hero > *:not(.bgart):not(.skyline){position:relative}

function depositAxis(t){
  const d=t.deposit; const r=[];
  r.push(d.due===0?['收取','無須押金','neutral']:d.collected?['收取','已收取 '+krw(d.collected.amt),'success']:['收取','待收取 '+krw(d.due),'warning']);
  if(d.due>0&&d.collected){
    if(!t.settlement) r.push(['退款依據','待住宿結算','neutral']);
    else if(!t.settlement.playerConfirmed) r.push(['退款依據','待玩家確認結算','warning']);
    else if(!t.settlement.venueAligned) r.push(['退款依據','待天城核對','warning']);
    else if(d.refundDue&&d.refundDue.amt>0) r.push(['退款依據','應退 '+krw(d.refundDue.amt),'info']); else r.push(['退款依據','無應退','neutral']);
    if(d.refundDue&&d.refundDue.amt>0) r.push(d.refunded?['退還','已退還 '+krw(d.refunded.amt),'success']:['退還','待退還','warning']);
  }
  return r;
}
function computeRefund(t){ // 逐晚：有兌換且該晚已付押金才應退
  if(!t.settlement||!t.deposit.collected) return 0;
  const paidNights=Math.round(t.deposit.collected.amt/300000);
  return Math.min(t.settlement.redeemed,paidNights)*300000;
}

function pageHead(title,desc,actions){ return `<div class="ph"><div><h1>${esc(title)}</h1>${desc?`<p>${esc(desc)}</p>`:''}</div><div class="actions">${actions||''}</div></div>`; }
function modal(){
  const m=S.ui.modal; if(!m) return '';
  return `<div class="modal-bg" data-act="closeModal"><div class="modal"><div class="mh">${esc(m.title)}</div><div class="mb">${m.body}</div><div class="mf">${A('closeModal',{},'關閉','btn secondary')}${m.ok?A(m.ok.act,m.ok.p,m.ok.label,'btn'):''}</div></div></div>`;
}
function tab(key,def){ return S.ui.tab[key]||def; }
function tabs(key,items,def){ const c=tab(key,def); return `<div class="tabs">${items.map(([k,l,n])=>`<button class="${c===k?'on':''}" data-act="tab" data-p='${esc(JSON.stringify({key,val:k}))}'>${l}${n!=null?`<span class="c">${String(n).padStart(2,'0')}</span>`:''}</button>`).join('')}</div>`; }
function mtabs(key,items,def){ const c=tab(key,def); return `<div class="mtabs">${items.map(([k,l])=>`<button class="${c===k?'on':''}" data-act="tab" data-p='${esc(JSON.stringify({key,val:k}))}'>${l}</button>`).join('')}</div>`; }
function seg(key,items,def){ const c=tab(key,def); return `<div class="seg">${items.map(([k,l])=>`<button class="${c===k?'on':''}" data-act="tab" data-p='${esc(JSON.stringify({key,val:k}))}'>${l}</button>`).join('')}</div>`; }
function stepper(steps,cur){ return `<div class="stepper">${steps.map((s,i)=>`<div class="step ${i<cur?'done':i===cur?'cur':''}"><div class="n">${i<cur?'✓':''}</div><div>${esc(s[0])}<small>${esc(s[1]||'')}</small></div></div>`).join('')}</div>`; }
function qrGrid(seedStr){ let h=0; for(const c of seedStr) h=(h*31+c.charCodeAt(0))>>>0; let out=''; for(let i=0;i<441;i++){ const x=i%21,y=(i/21)|0; const fp=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13); let b; if(fp){const lx=x%7>6?0:x, ly=y; const ex=x<7?x:x-14, ey=y<7?y:y-14; b=(ex===0||ex===6||ey===0||ey===6)||(ex>=2&&ex<=4&&ey>=2&&ey<=4);} else { h=(h^(h<<13))>>>0; h=(h^(h>>>17))>>>0; h=(h^(h<<5))>>>0; b=(h&3)===0; } out+=`<i class="${b?'b':''}"></i>`; } return `<div class="qr">${out}</div>`; }

/* ---------- router ---------- */
function render(){
  const {role,page,id}=cur(); S.ui.role=role;
  const R=ROLES[role]; if(!R){ location.hash='#/player/home'; return; }
  const fn=PAGES[role]&&(PAGES[role][page]||PAGES[role][Object.keys(PAGES[role])[0]]);
  let body=''; try{ body=fn(id); }catch(e){ console.error(e); body=`<div class="card pad">頁面渲染錯誤：${esc(e.message)}</div>`; }
  const shell=R.shell==='phone'?phoneShell(role,page,body):wsShell(role,page,body);
  $('#app').innerHTML=roleBar()+shell+modal()+scriptDrawer();
}
window.addEventListener('hashchange',()=>{ S.ui.rolemenu=false; render(); window.scrollTo(0,0); });
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.classList.contains('modal-bg')&&e.target!==b) return;
  const name=b.dataset.act; let p={}; try{p=JSON.parse(b.dataset.p||'{}');}catch(_){}
  if(!ACT[name]){ console.warn('no action',name); return; }
  const r=ACT[name](p,b); if(r!==false){ save(); render(); }
});
document.addEventListener('input',e=>{ const el=e.target; if(el.dataset.bind){ S.ui.sel[el.dataset.bind]=el.type==='checkbox'?el.checked:el.value; save(); } });
document.addEventListener('change',e=>{ const el=e.target; if(el.dataset.bind){ S.ui.sel[el.dataset.bind]=el.type==='checkbox'?el.checked:el.value; save(); if(el.dataset.rerender) render(); } });
const sel=k=>S.ui.sel[k];
const PAGES={}; const ACT={};
ACT.toggleRoleMenu=()=>{S.ui.rolemenu=!S.ui.rolemenu;};
ACT.switchRole=p=>{ S.ui.rolemenu=false; location.hash='#/'+p.role+'/'+NAV[p.role][0][0]; return false; };
ACT.reset=()=>{ reset(); return false; };
ACT.toggleScript=()=>{S.ui.script=!S.ui.script;};
ACT.goto=p=>{ go(p.role,p.page,p.id); return false; };
ACT.tab=p=>{ S.ui.tab[p.key]=p.val; };
ACT.closeModal=()=>{ S.ui.modal=null; };
ACT.openModal=p=>{ S.ui.modal=MODALS[p.m](p); };
ACT.noop=()=>{ toast('原型中此動作為示意，不改變資料','warn'); return false; };
const MODALS={};

      ${t.stage==='confirmed'&&t.venueCheckin==null?`<div class="row">${I.qr}<div class="g"><b>到場時出示到場碼</b><small>抵達 PokerRoom 櫃檯由琪琪掃碼核對</small></div><a href="#/player/qr" class="btn ghost">開啟 ›</a></div>`:''}`:'');

      <div class="mcard"><div class="mh"><span>本行程報到</span>${t.venueCheckin?badge('已報到','success'):badge('尚未報到','neutral')}</div>${t.venueCheckin?`<div class="mini">首次有效報到 ${t.venueCheckin} · 韓國時間</div>`:`<div class="mini">抵達 PokerRoom 櫃檯後出示此碼，由天城人員核對本人後確認。每行程一次。</div>`}</div>
      <div class="mcard"><div class="mh"><span>本次應付押金</span></div>${t.deposit.due===0?'<div class="mini">積分已足夠支持全部晚數，無須押金。</div>':`<div class="amount"><span class="cur">KRW</span><span class="v">${Number(t.deposit.due).toLocaleString()}</span></div><div class="mini">收款方：天城 PokerRoom（韓元現金）。到場時直接向天城支付，POKERNEXT 不代收。</div>`}</div></div>`;

  points(){

      <div style="display:flex;gap:10px"><a href="#/player/trips" class="btn secondary" style="flex:1">換證／聯絡變更</a>${A('noop',{},'登出','btn secondary')}</div></div>`;
  },
};
function tripDetail(t){
  const m=member(t.uuid); const chgs=S.changeRequests.filter(c=>c.tripId===t.id);
  const todos=tripTodos(t);
  const canPre=['confirmed','approved','applied'].includes(t.stage)&&!t.hotelCheckin;

    ${todos.length?todos.map(x=>`<div class="mcard" style="border-color:var(--gold-dim)"><div class="mh"><span>${esc(x[0])}</span></div><div class="mini">${esc(x[1])}</div>${x[2]?`<div style="margin-top:12px">${A(x[2].act,x[2].p,x[2].label,'btn m block')}</div>`:''}</div>`).join(''):''}
    ${playerStrip(t)}
    <div class="mcard"><div class="mh"><span>住宿資訊</span>${t.hotel.status==='confirmed'?badge('有效','success'):badge('確認中','warning')}</div>${kv([['酒店',esc(t.hotel.name)],['住宿確認編號',`<span class="mono">${t.hotel.conf||'—'}</span>`],['入住 / 預計退房',`${t.cin} – ${t.cout} · ${t.nights} 晚`],['實際入住',t.hotelCheckin||'尚未入住（酒店回報後更新）'],['實際退房',t.hotelCheckout||'—']],true)}${t.hotel.next?`<div class="info" style="margin-top:10px">${I.bed}<div><b>接續單 ${esc(t.hotel.next.conf)}</b><span>${esc(t.hotel.next.dates)}</span></div></div>`:''}</div>
    <div class="mcard"><div class="mh"><span>接機集合資訊</span>${t.pickup.arr.status==='none'?badge('自行前往','neutral'):t.pickup.arr.car?badge('已確認','success'):badge('待確認','warning')}</div>${t.pickup.arr.status==='none'?'<div class="mini">您選擇自行前往。</div>':kv([['航班',esc(t.pickup.arr.flight)],['抵達',esc(t.pickup.arr.time)+' · 韓國時間'],['集合',esc(t.pickup.arr.terminal||'—')+' 入境大廳 3 號出口'],['車輛',t.pickup.arr.car?esc(t.pickup.arr.car):'待天城安排確認']],true)}<div class="hint" style="margin-top:6px">接機免費；送機由玩家直接付車方。</div></div>
    <div class="mcard"><div class="mh"><span>天城押金</span></div>${depositAxis(t).map(x=>`<div class="row" style="padding:8px 0"><div class="g"><b>${esc(x[0])}</b></div>${dot(x[1],x[2])}</div>`).join('')}${t.deposit.collected?`<div class="row" style="padding:8px 0"><div class="g"><b>本人支付確認</b></div>${t.deposit.playerPaid?dot('已確認 '+t.deposit.playerPaid,'success'):dot('待本人確認','warning')}</div>`:''}${t.deposit.refunded?`<div class="row" style="padding:8px 0"><div class="g"><b>本人收款確認</b></div>${t.deposit.playerReceived?dot('已確認 '+t.deposit.playerReceived,'success'):dot('待本人確認','warning')}</div>`:''}<div class="hint" style="margin-top:8px">收退款方均為天城 PokerRoom，韓元現金、無收據附件。</div>${t.deposit.collected?`<div style="margin-top:10px">${A('openModal',{m:'case',tripId:t.id,type:'押金紀錄需要核實'},'押金紀錄需要核實','btn secondary sm')}</div>`:''}</div>
    ${chgs.length?`<div class="mcard"><div class="mh"><span>行程異動紀錄</span></div>${chgs.map(c=>`<div class="row" style="padding:10px 0"><div class="g"><b>${CHG_TYPE[c.type]}</b><small>${c.id} · 送出 ${c.submitted}</small>${c.result?`<small style="color:var(--text)">結果：${c.result.ok==='all'?'全部成功':c.result.ok==='part'?'部分成功':'無法辦理'}${c.result.conf?' · '+c.result.conf:''}</small>`:''}</div>${badge(CHG_STAGE[c.stage][0],CHG_STAGE[c.stage][1])}${c.stage==='pending'?A('withdrawChange',{id:c.id},'撤回','btn ghost sm'):''}</div>`).join('')}</div>`:''}
    ${(canPre||canIn)&&!openChg?`<div class="mcard"><div class="mh"><span>${canIn?'入住中可申請':'入住前可申請'}</span></div><div style="display:flex;flex-direction:column;gap:8px">${canIn?A('openModal',{m:'change',id:t.id,type:'extend'},'申請續住','btn secondary m')+A('openModal',{m:'change',id:t.id,type:'reschedule'},'申請改期','btn secondary m'):A('openModal',{m:'change',id:t.id,type:'reschedule'},'修改住宿日期','btn secondary m')+A('openModal',{m:'change',id:t.id,type:'cancel'},'取消行程','btn danger m')}</div><div class="hint">送出後由天城處理；送出不等於新安排成立。</div></div>`:''}
    <div class="mcard"><div class="mh"><span>本行程歷程</span></div><div class="mtimeline">${(t.history||[]).slice().reverse().map(h=>`<div class="mtl"><div>${esc(h.e)}<small>${h.t} · ${esc(h.by)}</small></div></div>`).join('')||'<div class="mini">尚無紀錄</div>'}</div></div>
    ${A('openModal',{m:'case',tripId:t.id,type:'行程問題'},'回報本行程問題','btn secondary m block')}</div>`;
}
function applyForm(){
  const m=member(ME);
  return `<div class="mpage"><a href="#/player/trips" class="btn ghost" style="align-self:flex-start;padding:0">‹ 我的行程</a><h1>申請新行程</h1><div class="hint">送出即產生行程編號，由管理者核對後訂房訂車；押金於到場時直接付天城。</div>
    <div class="field"><label>目的地／場館</label><select class="input" data-bind="ap_dest"><option>濟州島 · 天城 PokerRoom</option></select></div>
    <div class="grid2" style="gap:12px"><div class="field"><label>入住</label><input class="input" type="date" value="${sel('ap_cin')||'2026-10-03'}" data-bind="ap_cin"></div><div class="field"><label>退房</label><input class="input" type="date" value="${sel('ap_cout')||'2026-10-06'}" data-bind="ap_cout"></div></div>
    <div class="grid2" style="gap:12px"><div class="field"><label>去程航班</label><input class="input" placeholder="KE 1201" value="${esc(sel('ap_f1')||'')}" data-bind="ap_f1"></div><div class="field"><label>回程航班</label><input class="input" placeholder="KE 1208" value="${esc(sel('ap_f2')||'')}" data-bind="ap_f2"></div></div>
    <div class="field"><label>接機需求（帶入您的偏好，請確認）</label><select class="input" data-bind="ap_pick"><option ${(sel('ap_pick')||m.pickupPref)==='需要接機'?'selected':''}>需要接機</option><option ${(sel('ap_pick')||m.pickupPref)==='自行前往'?'selected':''}>自行前往</option></select></div>
    <div class="field"><label>同行旅客</label><input class="input" placeholder="無（本人一間房）" data-bind="ap_co"></div>
    <div class="mcard"><div class="mh"><span>住宿需求預覽</span></div><div class="mini">可用 ${pts(m.ledger-m.reserved)} 分 → 可兌換 ${Math.floor((m.ledger-m.reserved)/25000)} 晚；不足晚數每晚押金 KRW 300,000，到場時付天城。此預覽不占分。</div></div>
    <label class="check"><input type="checkbox" data-bind="ap_agree" ${sel('ap_agree')?'checked':''}> 我了解押金與積分保留條件（版本 2026-09）</label>
    ${A('applyTrip',{},'送出行程申請','btn m block')}</div>`;
}
MODALS.confirmVersion=p=>{ const t=trip(p.id); return {title:`行程版本 v${t.version} 待您確認`,body:`<div class="split"><div><div class="k">原安排（v${t.playerConfirmedVersion}）</div><div class="v">接機待安排</div></div><div><div class="k">新安排（v${t.version}）</div><div class="v">${esc(t.pickup.arr.flight)} ${esc(t.pickup.arr.time)}<br>集合 ${esc(t.pickup.arr.terminal||'')} 入境大廳 3 號出口</div></div></div><div class="mini">已讀不等於接受；按下確認才記錄您同意此版本。住宿與押金條件不變。</div>`,ok:{act:'confirmVersion',p:{id:t.id},label:`確認版本 v${t.version}`}}; };
MODALS.change=p=>{ const t=trip(p.id); const type=p.type; const title=CHG_TYPE[type];
  const body=type==='cancel'?`<div class="info">${I.info}<div><b>取消將送至天城辦理</b><span>天城完成外部取消前，行程顯示「取消處理中」。已付押金依天城確認結果另行處理，不會由取消鍵直接退款。</span></div></div><div class="field"><label>原因（選填）</label><textarea class="input" data-bind="chg_note" placeholder="例如：臨時公務"></textarea></div>`
   :type==='extend'?`<div class="field"><label>希望延長至（目前退房 ${t.cout}）</label><input class="input" type="date" data-bind="chg_cout" value="${sel('chg_cout')||'2026-09-14'}"></div><div class="mini">續住以接續單處理，原行程編號不變；積分不足的晚數另計押金。</div>`
   :`<div class="grid2" style="gap:12px"><div class="field"><label>新入住</label><input class="input" type="date" data-bind="chg_cin" value="${sel('chg_cin')||t.cin.replace(/\//g,'-')}"></div><div class="field"><label>新退房</label><input class="input" type="date" data-bind="chg_cout" value="${sel('chg_cout')||t.cout.replace(/\//g,'-')}"></div></div><div class="mini">送出修改不等於新安排成立；天城回報後由管理者核對，再請您確認新版本。</div>`;
  return {title,body,ok:{act:'requestChange',p:{id:t.id,type},label:'送出申請'}}; };
MODALS.settlement=p=>{ const t=trip(p.id); const s=t.settlement; const m=member(t.uuid); const rd=computeRefund(t);
  return {title:`住宿結算 ${s.id} v${s.version}`,body:`${kv([['住宿確認編號',`<span class="mono">${t.hotel.conf}</span>`],['實際住宿',`${t.cin} – ${t.hotelCheckout?t.hotelCheckout.slice(0,10):t.cout} · ${s.nights} 晚`],['本次可用積分',pts(m.ledger)+' 分'],['兌換晚數',`${s.redeemed} 晚 × 25,000 = ${pts(s.points)} 分`],['已付押金',t.deposit.collected?krw(t.deposit.collected.amt):'—'],['預計應退',krw(rd)+'（天城核對後生效）']])}<div class="mini">確認後形成截止快照並正式扣分；之後晚到的積分仍入本行程但不追加本次退款。</div>`,ok:{act:'confirmSettlement',p:{id:t.id},label:'確認本次結算'}}; };
MODALS.case=p=>({title:'回報問題',body:`<div class="field"><label>問題類型</label><select class="input" data-bind="case_type"><option ${p.type==='押金紀錄需要核實'?'selected':''}>押金紀錄需要核實</option><option ${p.type==='積分疑問'?'selected':''}>積分疑問</option><option ${p.type==='行程問題'?'selected':''}>行程問題</option><option>其他</option></select></div><div class="field"><label>關聯</label><input class="input" value="${esc(p.tripId||'')}" readonly></div><div class="field"><label>說明</label><textarea class="input" data-bind="case_text" placeholder="請描述發生什麼、您預期的結果"></textarea></div><div class="hint">送出只建立案件，不直接改積分、預訂或收退狀態。同一送出重試不會建立多個案件。</div>`,ok:{act:'openCase',p:{tripId:p.tripId,type:p.type},label:'送出'}});

ACT.confirmVersion=p=>{ const t=trip(p.id); t.playerConfirmedVersion=t.version; hist(t,'Alex',`確認行程版本 v${t.version}`); audit('Alex','會員',`${t.id} 本人確認版本 v${t.version}`); S.ui.modal=null; toast(`已確認版本 v${t.version}`); };
ACT.confirmPaid=p=>{ const t=trip(p.id); t.deposit.playerPaid=nowStamp(); hist(t,'Alex','本人確認已支付押金 '+krw(t.deposit.collected.amt)); audit('Alex','會員',`${t.id} 本人確認已支付押金`); toast('已記錄您的支付確認'); };
ACT.confirmReceived=p=>{ const t=trip(p.id); t.deposit.playerReceived=nowStamp(); hist(t,'Alex','本人確認已收到退款 '+krw(t.deposit.refunded.amt)); audit('Alex','會員',`${t.id} 本人確認已收到退款`); toast('已記錄您的收款確認'); };
ACT.confirmSettlement=p=>{ const t=trip(p.id); const m=member(t.uuid); t.settlement.playerConfirmed=nowStamp(); m.ledger-=t.settlement.points; m.reserved=Math.max(0,m.reserved-t.settlement.points); t.deposit.refundDue={amt:computeRefund(t),version:`${t.settlement.id} v${t.settlement.version}`}; hist(t,'Alex','本人確認結算，正式扣分 '+pts(t.settlement.points)); audit('Alex','會員',`${t.id} 本人確認結算 ${t.settlement.id}，扣分 ${pts(t.settlement.points)}`); S.ui.modal=null; toast('結算已確認，已產生住宿兌換核對單送天城'); };
ACT.requestChange=p=>{ const t=trip(p.id); const id='CHG-260911-'+String(S.changeRequests.length+7).padStart(3,'0'); const m=member(t.uuid); const c={id,tripId:t.id,type:p.type,stage:'pending',by:m.name,submitted:nowStamp(),note:sel('chg_note')||'',history:[{t:nowStamp(),e:'申請已收到'}]}; if(p.type==='extend') c.want={cout:(sel('chg_cout')||'2026-09-14').replace(/-/g,'/')}; if(p.type==='reschedule') c.want={cin:(sel('chg_cin')||'').replace(/-/g,'/'),cout:(sel('chg_cout')||'').replace(/-/g,'/')}; S.changeRequests.unshift(c); if(p.type==='cancel'){ t.stage='cancelling'; } hist(t,'Alex','送出'+CHG_TYPE[p.type]+' '+id); audit(m.cn,'會員',`${t.id} 送出${CHG_TYPE[p.type]} ${id}`); S.ui.modal=null; toast('已送出，天城端已收到案件 '+id); };
ACT.withdrawChange=p=>{ const c=S.changeRequests.find(x=>x.id===p.id); if(c.stage!=='pending'){toast('已開始執行，無法直接撤回；請改提撤回請求','warn');return false;} c.stage='withdrawn'; c.history.push({t:nowStamp(),e:'開始前撤回'}); const t=trip(c.tripId); if(c.type==='cancel'&&t.stage==='cancelling') t.stage=t.hotelCheckin?'checked_in':'confirmed'; toast('已撤回 '+c.id); };
ACT.applyTrip=()=>{ if(!sel('ap_agree')){toast('請先勾選同意條件','warn');return false;} const m=member(ME); const cin=(sel('ap_cin')||'2026-10-03').replace(/-/g,'/'), cout=(sel('ap_cout')||'2026-10-06').replace(/-/g,'/'); const n=Math.max(1,Math.round((new Date(cout)-new Date(cin))/86400000)); const id='TR-'+cin.slice(2,4)+cin.slice(5,7)+cin.slice(8,10)+'-0'+(40+S.trips.length); const avail=m.ledger-m.reserved; const coverable=Math.min(n,Math.floor(avail/25000)); const t={id,uuid:ME,dest:'濟州島',en:'JEJU ISLAND',cin,cout,nights:n,hotel:{name:'濟州君悅酒店',conf:null,status:'pending'},stage:'applied',version:1,playerConfirmedVersion:1,pickup:{arr:{flight:sel('ap_f1')||'待補',time:cin+' —',terminal:'濟州機場 T1',status:(sel('ap_pick')||m.pickupPref)==='自行前往'?'none':'pending'},dep:{flight:sel('ap_f2')||'待補',time:cout+' —',status:'pending'}},venueCheckin:null,hotelCheckin:null,hotelCheckout:null,host:null,deposit:{due:(n-coverable)*300000,collected:null,refundDue:null,refunded:null,playerPaid:null,playerReceived:null},settlement:null,reservePlan:coverable*25000,history:[{t:nowStamp(),by:'Alex',e:`送出行程申請（${n} 晚、${sel('ap_pick')||m.pickupPref}）`}]}; S.trips.push(t); audit('Alex','會員',`送出行程申請 ${id}`); ['ap_agree','ap_f1','ap_f2','ap_co'].forEach(k=>delete S.ui.sel[k]); go('player','trips',id); toast('申請已送出，行程編號 '+id); return false; };
ACT.openCase=p=>{ const m=member(ME); const id='CASE-260911-0'+(32+S.cases.length); S.cases.unshift({id,type:sel('case_type')||p.type,tripId:p.tripId,by:m.name,t:nowStamp(),status:'待受理',text:sel('case_text')||''}); audit(m.cn,'會員',`建立案件 ${id}（${sel('case_type')||p.type}）`); S.ui.modal=null; delete S.ui.sel.case_text; toast('已收到，案件編號 '+id); };
ACT.savePrefs=()=>{ const m=member(ME); if(sel('lang')) m.lang=sel('lang'); if(sel('pickupPref')) m.pickupPref=sel('pickupPref'); if(sel('rest')) m.restReminder=Number(sel('rest')); toast('偏好已儲存'); };
</script>
<script>
/* ================= 天城合作端 ================= */
const onIsland=()=>S.trips.filter(t=>t.hotelCheckin&&!t.hotelCheckout&&t.stage!=='cancelled');
const arrivingToday=()=>S.trips.filter(t=>t.cin===TODAY&&!['cancelled','cancelling'].includes(t.stage));
const venueTripRow=t=>{ const m=member(t.uuid); return `<tr class="row"><td>${esc(m.name)}</td><td class="mono">${m.tc}</td><td><span class="mono">${t.id}</span><span class="sub">${t.cin.slice(5)} – ${t.cout.slice(5)}</span></td><td>${t.venueCheckin?dot('已到場','success'):dot('待報到','warning')}</td><td>${t.deposit.due===0?dot('無須押金','neutral'):t.deposit.collected?dot('已收取','success'):dot('待收取','warning')}</td><td>${A('goto',{role:'venue',page:'checkin',id:t.id},'查看','btn secondary sm')}</td></tr>`; };
PAGES.venue={
  overview(){
    const pend=S.changeRequests.filter(c=>c.stage==='pending'||c.stage==='in_progress');
    const refunds=S.trips.filter(t=>t.deposit.refundDue&&t.deposit.refundDue.amt>0&&!t.deposit.refunded);
    const list=tab('vov','today')==='today'?arrivingToday():tab('vov')==='island'?onIsland():S.trips.filter(t=>t.hotelCheckout&&t.hotelCheckout.startsWith(TODAY));
    const q=(sel('vq')||'').toLowerCase();
    const filtered=list.filter(t=>!q||t.id.toLowerCase().includes(q)||member(t.uuid).name.toLowerCase().includes(q)||member(t.uuid).tc.toLowerCase().includes(q));
    const todos=[...pend.map(c=>({ic:I.doc,title:CHG_TYPE[c.type],b:badge(CHG_STAGE[c.stage][0],CHG_STAGE[c.stage][1]),kv:[['行程',c.tripId],['申請人',c.by],['申請時間',c.submitted]],btn:A('goto',{role:'venue',page:'changes',id:c.id},c.stage==='pending'?'開始執行':'查看需求')})),...refunds.map(t=>({ic:I.coins,title:'押金退還',b:badge('待退還','danger'),kv:[['行程',t.id],['申請人',member(t.uuid).name],['退還金額',krw(t.deposit.refundDue.amt)]],btn:A('goto',{role:'venue',page:'deposits',id:t.id},'查看明細')}))];
    return pageHead('工作總覽','天城 PokerRoom',A('goto',{role:'venue',page:'checkin'},I.scan+' 掃碼報到'))+`
      <div class="kpis"><div class="kpi">${I.users}<div><div class="l">今日預計到訪</div><div class="v">${String(arrivingToday().length).padStart(2,'0')}</div></div></div><div class="kpi">${I.user}<div><div class="l">在島玩家</div><div class="v">${String(onIsland().length).padStart(2,'0')}</div></div></div><div class="kpi">${I.doc}<div><div class="l">待處理異動</div><div class="v">${String(pend.length).padStart(2,'0')}</div></div></div><div class="kpi">${I.clock}<div><div class="l">待退押金</div><div class="v">${String(refunds.length).padStart(2,'0')}</div></div></div></div>
      <div class="grid32"><div class="card">${tabs('vov',[['today','今日到訪'],['island','在島玩家'],['out','今日退房']],'today')}<div style="padding:16px 24px"><div class="search">${I.search}<input placeholder="輸入姓名、會員或行程編號" value="${esc(sel('vq')||'')}" data-bind="vq" data-rerender="1"></div></div>
        ${filtered.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>玩家</th><th>天城會員編號</th><th>行程與住宿</th><th>報到狀態</th><th>押金狀態</th><th>操作</th></tr></thead><tbody>${filtered.map(venueTripRow).join('')}</tbody></table></div>`:empty(q?'搜尋無結果':'今日尚無符合的行程',q?'請確認姓名、會員或行程編號':'資料依有效紀錄產生，不以掃碼次數代替人數。')}
        <div class="chead" style="border-top:1px solid var(--border)"><h3>最近處理</h3><a href="#/platform/audit" class="btn ghost sm">查看全部 ›</a></div><div class="timeline" style="padding:0 24px 8px">${S.audit.filter(a=>a.role==='天城').slice(0,4).map(a=>`<div class="tl"><span></span><span class="tm">${a.t.slice(11)}</span><span class="ev">${esc(a.e.split(' ')[1]||a.e.slice(0,10))}</span><span class="mono">${esc(a.e.split(' ')[0])}</span><span class="ds">${esc(a.e)}</span></div>`).join('')}</div></div>
      <div><div class="chead" style="border:0;padding:0 0 12px"><h3>待辦事項</h3><span class="mini">${todos.length} 件</span></div><div class="todo">${todos.length?todos.map(x=>`<div class="card"><div class="th">${x.ic}${esc(x.title)} ${x.b}</div>${kv(x.kv,true)}<div style="margin-top:12px">${x.btn.replace('class="btn"','class="btn block"')}</div></div>`).join(''):empty('目前沒有待辦','異動申請與待退押金會出現在這裡。')}<div class="hint" style="text-align:right">最新資料 ${NOW} · 韓國時間</div></div></div></div>`;
  },
  checkin(id){

function changeDetail(c){
  const t=trip(c.tripId); const m=member(t.uuid);
  const steps=[['申請已收到',c.submitted],['開始執行',c.started?c.started+' · '+c.startedBy:''],[c.type==='cancel'?'已完成':'已回報',c.result?(c.history.slice(-1)[0].t):'']];
  const cur=c.stage==='pending'?0:c.stage==='in_progress'?1:c.stage==='withdrawn'?0:3;
  const want=c.type==='cancel'?'取消本次行程與住宿':c.type==='extend'?`續住至 ${c.want.cout}`:`改為 ${c.want.cin} – ${c.want.cout}`;
  return `<div class="card"><div class="chead"><div><h3>${CHG_TYPE[c.type]} ${badge(CHG_STAGE[c.stage][0],CHG_STAGE[c.stage][1])}</h3><div class="mini">案件編號 <span class="mono">${c.id}</span></div></div></div><div class="cbody">
    ${kv([['玩家',esc(m.name)],['天城會員編號',`<span class="mono">${m.tc}</span>`],['行程編號',`<span class="mono">${t.id}</span>`],['住宿確認編號',`<span class="mono">${t.hotel.conf}</span> ${A('noop',{},'檢視確認單','btn ghost sm')}`]])}
    <div class="split" style="margin:16px 0"><div><div class="k">目前住宿</div><div class="v">${t.cin} – ${t.cout} · ${t.nights} 晚</div></div><div><div class="k">申請內容（版本 v1）</div><div class="v">${esc(want)}</div></div></div>
    <div class="mini">酒店入住：${t.hotelCheckin?'已入住 '+t.hotelCheckin:'尚未入住'}${c.note?' · 備註：'+esc(c.note):''}</div>
    <div class="label" style="margin:18px 0 0">處理進度</div>${stepper(steps,cur)}
    ${c.stage==='pending'?`<div style="display:flex;gap:10px;margin-top:16px">${A('startChange',{id:c.id},'開始執行')}</div><div class="hint" style="margin-top:8px">開始時將重查最新需求版本；單純查看不算開始。</div>`:''}
    ${c.stage==='in_progress'?(c.type==='cancel'?`<div style="margin-top:16px"><div class="label" style="margin-bottom:8px">取消結果</div><label class="check"><input type="checkbox" data-bind="chg_done_${c.id}" data-rerender="1" ${sel('chg_done_'+c.id)?'checked':''}> 已在天城系統完成取消</label><div class="field" style="margin-top:12px"><label>處理備註</label><textarea class="input" data-bind="chg_memo_${c.id}" placeholder="原住宿確認單已作廢。">${esc(sel('chg_memo_'+c.id)||'')}</textarea></div><div style="display:flex;gap:10px;margin-top:16px;align-items:center">${A('completeCancel',{id:c.id},'已完成','btn'+(sel('chg_done_'+c.id)?'':' disabled'))}${A('noop',{},'儲存備註','btn secondary')}<span class="mini" style="margin-left:auto">完成後玩家端立即顯示已取消，不等管理者批准</span></div></div>`
      :`<div style="margin-top:16px"><div class="label" style="margin-bottom:8px">回報結果</div><div class="radio"><label><input type="radio" name="r_${c.id}" data-bind="chg_res_${c.id}" value="all" ${(sel('chg_res_'+c.id)||'all')==='all'?'checked':''}> 全部成功（同房型）</label><label><input type="radio" name="r_${c.id}" data-bind="chg_res_${c.id}" value="part" ${sel('chg_res_'+c.id)==='part'?'checked':''}> 部分成功（提供實際可行日期）</label><label><input type="radio" name="r_${c.id}" data-bind="chg_res_${c.id}" value="no" ${sel('chg_res_'+c.id)==='no'?'checked':''}> 無法辦理</label></div><div class="field" style="margin-top:12px"><label>${c.type==='extend'?'接續單編號':'新／同號確認單編號'}</label><input class="input" value="${esc(sel('chg_conf_'+c.id)||t.hotel.conf+'-A')}" data-bind="chg_conf_${c.id}"></div><div style="display:flex;gap:10px;margin-top:16px">${A('reportChange',{id:c.id},'送出回報')}</div><div class="hint" style="margin-top:8px">回報後由 POKERNEXT 管理者核對並正式登錄；不在此直接改玩家的正式安排。</div></div>`)
    :''}
    ${c.stage==='reported'?`<div class="info" style="margin-top:16px">${I.info}<div><b>已回報，等待管理者核對</b><span>結果：${c.result.ok==='all'?'全部成功':c.result.ok==='part'?'部分成功':'無法辦理'}${c.result.conf?' · '+esc(c.result.conf):''}</span></div></div>`:''}
    ${c.stage==='done'?`<div class="info" style="margin-top:16px">${I.check}<div><b>已完成</b><span>${c.type==='cancel'?'玩家端已顯示已取消；押金／接送未完事項另行保留。':'管理者已核對並正式登錄。'}</span></div></div>`:''}
    <div class="label" style="margin:18px 0 6px">案件歷程</div><div class="mtimeline">${c.history.map(h=>`<div class="mtl"><div>${esc(h.e)}<small>${h.t}</small></div></div>`).join('')}</div>
    </div><div class="cfoot"><span>玩家端目前顯示：<b style="color:var(--gold-bright)">${c.type==='cancel'?(c.stage==='done'?'已取消':c.stage==='in_progress'?'執行取消行程中':c.stage==='pending'?'取消中，等待回覆':'—'):CHG_STAGE[c.stage][0]}</b></span><span>最後更新 ${c.history.slice(-1)[0].t}</span></div></div>`;
}
function depositDetail(t){
  const d=t.deposit; const m=member(t.uuid);
  const canRefund=d.refundDue&&d.refundDue.amt>0&&!d.refunded;
  return `<div class="card"><div class="chead"><h3>${esc(m.name)} · <span class="mono muted">${t.id}</span></h3>${dot(canRefund?'待退還':d.refunded?'已退還':d.collected?'已收取':'待收取',canRefund?'danger':d.refunded||d.collected?'success':'warning')}</div><div class="cbody grid2">
    <div><div class="label" style="margin-bottom:8px">收取軸</div>${kv([['應收',krw(d.due)],['實收',d.collected?krw(d.collected.amt):'—'],['收款時間／人',d.collected?d.collected.t+' · '+d.collected.by:'—'],['玩家本人確認',d.collected?(d.playerPaid?dot('已確認 '+d.playerPaid,'success'):dot('待本人確認','warning')):'—']])}${!d.collected?`<div style="margin-top:12px">${A('goto',{role:'venue',page:'checkin',id:t.id},'前往報到頁收取','btn secondary')}</div>`:''}</div>
    <div><div class="label" style="margin-bottom:8px">退還軸</div>${kv([['退款依據',t.settlement?(t.settlement.venueAligned?`${t.settlement.id} v${t.settlement.version} · 雙方已對齊`:'核對單待對齊'):'待住宿結算'],['應退',d.refundDue?krw(d.refundDue.amt):'—'],['實退',d.refunded?krw(d.refunded.amt)+' · '+d.refunded.t:'—'],['玩家本人確認',d.refunded?(d.playerReceived?dot('已確認 '+d.playerReceived,'success'):dot('待本人確認','warning')):'—']])}
    ${canRefund?`<div class="field" style="margin-top:14px"><label>實退金額（須與應退完全一致）</label><div class="prefix"><span>KRW</span><input class="input" value="${sel('rf_amt_'+t.id)||Number(d.refundDue.amt).toLocaleString()}" data-bind="rf_amt_${t.id}"></div></div><div style="display:flex;gap:10px;margin-top:14px">${A('refundDeposit',{id:t.id},'已退還押金')}${A('openModal',{m:'diff',id:t.id},'轉差異案件','btn secondary')}</div><div class="hint" style="margin-top:8px">首版不開正常部分退款；金額不一致不能完成。</div>`:''}</div>
    </div><div class="cfoot"><span>收退款方均為天城 PokerRoom · 韓元現金 · 無收據附件</span><span>行程獨立付款、獨立退款</span></div></div>`;
}
MODALS.diff=p=>({title:'提出資料差異',body:`<div class="field"><label>差異項目</label><select class="input" data-bind="diff_type"><option>積分</option><option>住宿日期／晚數</option><option>押金金額</option><option>編號／姓名</option></select></div><div class="field"><label>說明</label><textarea class="input" data-bind="diff_text" placeholder="例如：天城系統顯示 9/10 積分為 4,500，核對單為 4,200"></textarea></div><div class="field"><label>憑據</label><div class="input" style="display:flex;align-items:center;color:var(--text-3)">${I.upload.replace('<svg','<svg style="width:18px;height:18px;stroke:currentColor;fill:none;margin-right:8px"')} 拖曳或選擇檔案（JPG／PNG／PDF）</div></div><div class="hint">差異案件由 POKERNEXT 管理者處理，天城不直接修改平台帳目。</div>`,ok:{act:'raiseDiff',p:{id:p.id},label:'建立差異案件'}});
MODALS.assignCar=p=>({title:'安排車輛',body:`<div class="field"><label>車輛／車牌</label><input class="input" data-bind="car" value="${esc(sel('car')||'黑色 Carnival · 34나 7788')}"></div><div class="field"><label>集合位置</label><input class="input" value="濟州機場 T1 入境大廳 3 號出口" readonly></div><div class="hint">只提供司機必要接送資訊；不提供護照圖、積分或全行程存取。</div>`,ok:{act:'assignCar',p,label:'儲存安排'}});
ACT.venueCheckin=p=>{ const t=trip(p.id); if(t.venueCheckin) return false; t.venueCheckin=nowStamp(); if(t.stage==='confirmed') t.stage='arrived'; hist(t,'琪琪','天城櫃檯確認到場報到'); audit('琪琪','天城',`${t.id} 確認到場報到`); toast('已確認到場，本行程報到一次'); };
ACT.collectDeposit=p=>{ const t=trip(p.id); const amt=Number(String(sel('ck_amt_'+t.id)||t.deposit.due).replace(/,/g,'')); if(!amt||amt<=0){toast('實收 0 不能記已收','err');return false;} if(amt!==t.deposit.due){toast('實收與應收不一致，請轉差異案件','err');return false;} t.deposit.collected={amt,t:sel('ck_time_'+t.id)||nowStamp(),by:'琪琪'}; hist(t,'琪琪','天城已收到押金 '+krw(amt)); audit('琪琪','天城',`${t.id} 已收到押金 ${krw(amt)}`); toast('已記錄收款；玩家端將請本人確認'); };
ACT.startChange=p=>{ const c=S.changeRequests.find(x=>x.id===p.id); c.stage='in_progress'; c.started=nowStamp(); c.startedBy='琪琪'; c.history.push({t:nowStamp(),e:'開始執行 · 琪琪'}); const t=trip(c.tripId); if(c.type==='cancel') t.stage='cancelling'; hist(t,'琪琪',`天城開始執行 ${CHG_TYPE[c.type]}`); audit('琪琪','天城',`${c.id} 開始執行（${CHG_TYPE[c.type]}）`); toast('已開始執行，已重查最新需求版本 v1'); };
ACT.completeCancel=p=>{ const c=S.changeRequests.find(x=>x.id===p.id); if(!sel('chg_done_'+c.id)) return false; c.stage='done'; c.result={ok:'all',note:sel('chg_memo_'+c.id)||''}; c.history.push({t:nowStamp(),e:'天城完成取消 · 已完成'}); const t=trip(c.tripId); t.stage='cancelled'; t.hotel.status='void'; const m=member(t.uuid); m.reserved=Math.max(0,m.reserved-25000*Math.min(t.nights,Math.floor(m.ledger/25000))); hist(t,'琪琪','天城完成外部取消，行程已取消並歸檔'); audit('琪琪','天城',`${c.id} 取消完成，${t.id} 已取消`); toast('已完成；玩家端與管理端已同步為已取消'); };
ACT.reportChange=p=>{ const c=S.changeRequests.find(x=>x.id===p.id); const ok=sel('chg_res_'+c.id)||'all'; c.stage='reported'; c.result={ok,conf:ok==='no'?null:(sel('chg_conf_'+c.id)||trip(c.tripId).hotel.conf+'-A')}; c.history.push({t:nowStamp(),e:`回報：${ok==='all'?'全部成功':ok==='part'?'部分成功':'無法辦理'}${c.result.conf?'，接續單 '+c.result.conf:''}`}); const t=trip(c.tripId); hist(t,'琪琪',`天城回報${CHG_TYPE[c.type]}結果：${ok==='all'?'全部成功':ok==='part'?'部分成功':'無法辦理'}`); audit('琪琪','天城',`${c.id} 回報結果（${ok}）`); toast('已回報，等待管理者核對'); };
ACT.venueAlign=p=>{ const t=trip(p.id); t.settlement.venueAligned=nowStamp(); t.deposit.refundDue={amt:computeRefund(t),version:`${t.settlement.id} v${t.settlement.version}`}; hist(t,'琪琪','天城核對確認：雙方已對齊'+(t.deposit.refundDue.amt?'，應退 '+krw(t.deposit.refundDue.amt):'')); audit('琪琪','天城',`${t.settlement.id} 雙方已對齊`); toast('已記為雙方已對齊'+(t.deposit.refundDue.amt?'；產生應退 '+krw(t.deposit.refundDue.amt):'')); };
ACT.refundDeposit=p=>{ const t=trip(p.id); const amt=Number(String(sel('rf_amt_'+t.id)||t.deposit.refundDue.amt).replace(/,/g,'')); if(amt!==t.deposit.refundDue.amt){toast('實退金額須與應退完全一致；不一致請轉差異案件','err');return false;} t.deposit.refunded={amt,t:nowStamp(),by:'琪琪'}; hist(t,'琪琪','天城已退還押金 '+krw(amt)); audit('琪琪','天城',`${t.id} 已退還押金 ${krw(amt)}`); toast('已記錄退還；玩家端將請本人確認收到'); };
ACT.raiseDiff=p=>{ const t=trip(p.id); const id='CASE-260911-0'+(32+S.cases.length); S.cases.unshift({id,type:'資料差異：'+(sel('diff_type')||'積分'),tripId:t.id,by:'琪琪（天城）',t:nowStamp(),status:'待受理',text:sel('diff_text')||''}); audit('琪琪','天城',`建立差異案件 ${id}（${t.id}）`); S.ui.modal=null; toast('差異案件已建立 '+id+'，由管理者處理'); };
ACT.assignCar=p=>{ const t=trip(p.id); t.pickup[p.k].car=sel('car')||'黑色 Carnival · 34나 7788'; if(t.pickup[p.k].status==='pending') t.pickup[p.k].status='assigned'; hist(t,'琪琪',`天城安排${p.k==='arr'?'接機':'送機'}車輛 ${t.pickup[p.k].car}`); audit('琪琪','天城',`${t.id} 安排車輛`); S.ui.modal=null; toast('已儲存，管理端接送看板可核對'); };
</script>
<script>
/* ================= 管理端（管理者） ================= */
PAGES.admin={
  dashboard(){
    const applied=S.trips.filter(t=>t.stage==='applied'); const reported=S.changeRequests.filter(c=>c.stage==='reported'); const pendApps=S.applications.filter(a=>a.status==='pending');
    const unassigned=S.trips.filter(t=>!t.host&&!['cancelled','checked_out','settled','archived'].includes(t.stage));
    const today=S.trips.filter(t=>t.cin===TODAY&&!['cancelled'].includes(t.stage)); const tomorrow=S.trips.filter(t=>t.cin==='2026/09/12'&&t.stage!=='cancelled');
    const openCases=S.cases.filter(c=>c.status!=='已解決');
    return pageHead('服務監控儀表板','三階段工作與今日／明日接待。資料來自正式紀錄，顯示來源時間。')+`
      <div class="kpis"><div class="kpi">${I.users}<div><div class="l">今日接待</div><div class="v">${String(today.length).padStart(2,'0')}</div></div></div><div class="kpi">${I.cal}<div><div class="l">明日接待</div><div class="v">${String(tomorrow.length).padStart(2,'0')}</div></div></div><div class="kpi">${I.inbox}<div><div class="l">待我處理</div><div class="v">${String(applied.length+reported.length+pendApps.length+S.hostRequests.filter(h=>h.status==='pending').length+(S.pointsImport.status==='preview'?1:0)).padStart(2,'0')}</div></div></div><div class="kpi">${I.flag}<div><div class="l">未完成案件</div><div class="v">${String(openCases.length).padStart(2,'0')}</div></div></div></div>
      <div class="grid32"><div style="display:flex;flex-direction:column;gap:24px">
        <div class="card"><div class="chead"><h3>今日／明日接待</h3><span class="mini">來源：有效行程 · 最後更新 ${NOW}</span></div><div class="tblwrap"><table class="tbl"><thead><tr><th>玩家</th><th>行程</th><th>階段</th><th>酒店</th><th>接送</th><th>PokerRoom</th><th>接待人</th></tr></thead><tbody>${today.concat(tomorrow).map(t=>`<tr class="row"><td>${esc(member(t.uuid).name)}<span class="sub">${t.cin.slice(5)} 抵達</span></td><td class="mono">${t.id}</td><td>${stageBadge(t.stage)}</td><td>${t.hotelCheckin?dot('已入住','success'):t.hotel.status==='confirmed'?dot('已確認','info'):dot('確認中','warning')}</td><td>${t.pickup.arr.status==='none'?dot('自行','neutral'):t.pickup.arr.status==='done'?dot('已接到','success'):t.pickup.arr.car?dot('已安排','info'):dot('待安排','warning')}</td><td>${t.venueCheckin?dot('已報到','success'):dot('未報到','neutral')}</td><td>${t.host?esc(t.host):'<span style="color:var(--warning)">待指派</span>'}</td></tr>`).join('')}</tbody></table></div></div>
        <div class="card"><div class="chead"><h3>三階段工作</h3></div><div class="cbody" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">${[['售前',S.customers.filter(c=>c.phase==='presale').length,'待接洽／確認中'],['行程服務',S.customers.filter(c=>c.phase==='trip').length,'進行中行程'],['維護',S.customers.filter(c=>c.phase==='maintain').length,'退房後／回訪']].map(x=>`<div class="card el pad" style="padding:16px"><div class="mini">${x[0]}</div><div class="num" style="font-size:28px">${x[1]}</div><div class="hint">${x[2]}</div></div>`).join('')}</div></div></div>
      <div><div class="chead" style="border:0;padding:0 0 12px"><h3>待處理</h3></div><div class="todo">
        ${applied.map(t=>`<div class="card"><div class="th">${I.briefcase}行程申請待核對 ${badge('新','warning')}</div>${kv([['行程',t.id],['申請人',member(t.uuid).name],['需求',`${t.cin.slice(5)}–${t.cout.slice(5)} · ${t.nights} 晚`]],true)}<div style="margin-top:12px">${A('goto',{role:'admin',page:'trips',id:t.id},'核對並送訂','btn block')}</div></div>`).join('')}
        ${reported.map(c=>`<div class="card"><div class="th">${I.doc}天城已回報${CHG_TYPE[c.type]} ${badge('待核對','info')}</div>${kv([['案件',c.id],['行程',c.tripId],['結果',c.result.ok==='all'?'全部成功':c.result.ok==='part'?'部分成功':'無法辦理']],true)}<div style="margin-top:12px">${A('goto',{role:'admin',page:'trips',id:c.id},'核對並登錄','btn block')}</div></div>`).join('')}
        ${pendApps.length?`<div class="card"><div class="th">${I.shield}會員申請待審核 ${badge(pendApps.length+' 件','warning')}</div><div class="mini">${pendApps.map(a=>esc(a.name)).join('、')}</div><div style="margin-top:12px">${A('goto',{role:'admin',page:'review'},'前往審核工作台','btn block secondary')}</div></div>`:''}
        ${S.pointsImport.status==='preview'?`<div class="card"><div class="th">${I.coins}每日積分 Excel 待核准 ${badge('預覽中','info')}</div>${kv([['批次',S.pointsImport.id],['活動日',S.pointsImport.date],['列數',S.pointsImport.rows.length+' 列（1 列未配對）']],true)}<div style="margin-top:12px">${A('goto',{role:'admin',page:'points'},'查看差額預覽','btn block secondary')}</div></div>`:''}
        ${S.hostRequests.filter(h=>h.status==='pending').map(h=>`<div class="card"><div class="th">${I.inbox}代接待申請 ${badge('待指派','warning')}</div>${kv([['客戶',h.customer],['歸屬人',h.agent],['需求',h.want]],true)}<div style="margin-top:12px">${A('goto',{role:'admin',page:'hosting'},'指派服務人','btn block secondary')}</div></div>`).join('')}
        ${openCases.map(c=>`<div class="card"><div class="th">${I.chat}${esc(c.type)} ${badge(c.status,'info')}</div>${kv([['案件',c.id],['提出',c.by],['行程',c.tripId||'—']],true)}<div style="margin-top:12px">${A('openModal',{m:'replyCase',id:c.id},'處理／回覆','btn block secondary')}</div></div>`).join('')}
      </div></div></div>`;
  },
  customers(id){
    const f=tab('acu','all'); const list=S.customers.filter(c=>f==='all'||c.phase===f);
    const c=id?S.customers.find(x=>x.id===id):null;
    if(c) return customerDetail(c,'admin');
    return pageHead('客戶與跟進','Lead／會員列表；售前固定五種進度，行程與維護以正式紀錄衍生。',A('openModal',{m:'newLead'},'建立 Lead','btn secondary'))+`<div class="card">${tabs('acu',[['all','全部',S.customers.length],['presale','售前',S.customers.filter(x=>x.phase==='presale').length],['trip','行程服務',S.customers.filter(x=>x.phase==='trip').length],['maintain','維護',S.customers.filter(x=>x.phase==='maintain').length]],'all')}<div class="tblwrap"><table class="tbl"><thead><tr><th>客戶</th><th>階段</th><th>售前進度</th><th>歸屬人</th><th>歸屬期限</th><th>最近紀錄</th><th></th></tr></thead><tbody>${list.map(x=>`<tr class="row"><td>${esc(x.name)}<span class="sub mono">${x.uuid?short(x.uuid):x.id}</span></td><td>${badge({presale:'售前',trip:'行程服務',maintain:'維護'}[x.phase],{presale:'warning',trip:'info',maintain:'neutral'}[x.phase])}</td><td>${PRESALE[x.presale]}</td><td>${x.owner==='公共池'?'<span style="color:var(--warning)">公共池</span>':esc(x.owner)}</td><td>${x.ownerUntil}</td><td class="mini">${esc(x.last)}</td><td>${A('goto',{role:'admin',page:'customers',id:x.id},'詳情','btn secondary sm')}</td></tr>`).join('')}</tbody></table></div></div>`;
  },
  review(id){
    const list=S.applications; const a=id?list.find(x=>x.id===id):list.find(x=>x.status==='pending')||list[0];
    return pageHead('會員審核工作台','並列比對申請人輸入值、OCR 結果、證件原圖與重複候選；核准只對特定申請版本生效。')+`<div class="grid13"><div class="card"><div class="list">${list.map(x=>`<button class="li ${a&&a.id===x.id?'on':''}" data-act="goto" data-p='${esc(JSON.stringify({role:'admin',page:'review',id:x.id}))}'><div class="t"><span>${esc(x.name)}</span>${badge({pending:'待審核',need_docs:'補件中',approved:'已核准',rejected:'已拒絕'}[x.status],{pending:'warning',need_docs:'info',approved:'success',rejected:'danger'}[x.status])}</div><div class="b"><span class="mono">${x.id} · v${x.version}</span><span>${x.submitted.slice(5)}</span></div></button>`).join('')}</div></div>
      ${a?`<div class="card"><div class="chead"><h3>${esc(a.name)} <span class="muted mono">${a.id} · 版本 v${a.version}</span></h3>${a.dup?badge('重複候選','danger'):''}</div><div class="cbody">

        ${a.dup?`<div class="info" style="margin-top:16px">${I.info}<div><b>重複候選：${esc(a.dup.name)}（${a.dup.uuid}）</b><span>${esc(a.dup.reason)}。若核實為同一人，沿用原 UUID；不同人只改被占欄位。</span></div></div>`:''}

MODALS.newLead=()=>({title:'建立 Lead',body:`<div class="field"><label>稱呼</label><input class="input" data-bind="nl_name" placeholder="張先生"></div><div class="field"><label>來源</label><select class="input" data-bind="nl_src"><option>官方 LINE</option><option>活動頁諮詢</option><option>介紹</option></select></div><div class="hint">Lead ID 與之後的申請編號、正式 UUID 是三個不同識別；不必上傳證件。</div>`,ok:{act:'newLead',p:{},label:'建立'}});
MODALS.replyCase=p=>{const c=S.cases.find(x=>x.id===p.id);return {title:c.id+' · '+c.type,body:`${kv([['提出',esc(c.by)],['行程',c.tripId||'—'],['說明',esc(c.text||'（無）')],['狀態',badge(c.status,'info')]])}<div class="field"><label>公開回覆（不含內部資料）</label><textarea class="input" data-bind="case_reply">${esc(c.reply||'')}</textarea></div><div class="field"><label>更新狀態</label><select class="input" data-bind="case_status"><option>處理中</option><option>等待玩家／外部結果</option><option>已解決</option></select></div>`,ok:{act:'replyCase',p:{id:c.id},label:'送出回覆'}};};
MODALS.newTask=()=>({title:'建立任務',body:`<div class="field"><label>範本</label><select class="input" data-bind="nt_tpl">${Object.entries(TPL).map(([k,v])=>`<option value="${k}">${k} ${v.name}</option>`).join('')}</select></div><div class="field"><label>行程</label><select class="input" data-bind="nt_trip">${S.trips.filter(t=>!['cancelled','archived'].includes(t.stage)).map(t=>`<option>${t.id}</option>`).join('')}</select></div><div class="field"><label>指派</label><select class="input" data-bind="nt_who"><option>Amy</option><option>Ken</option></select></div>`,ok:{act:'newTask',p:{},label:'建立並指派'}});
ACT.approveTrip=p=>{ const t=trip(p.id); t.stage='approved'; hist(t,'王經理','核准並送訂天城'); audit('王經理','管理者',`${t.id} 核准送訂`); toast('已核准，等待天城回傳確認單'); };
ACT.confirmHotel=p=>{ const t=trip(p.id); const m=member(t.uuid); t.hotel.conf=sel('conf_'+t.id)||'GHJ-NEW'; t.hotel.status='confirmed'; t.stage='confirmed'; const cov=Math.min(t.nights,Math.floor((m.ledger-m.reserved)/25000)); m.reserved+=cov*25000; t.deposit.due=(t.nights-cov)*300000; if(!t.host){t.host='Amy';} S.tasks.push({id:'TSK-'+(1050+S.tasks.length),tpl:'T06',title:'酒店入住追蹤',tripId:t.id,uuid:t.uuid,assignee:t.host,status:'open',due:t.cin+' 16:00'}); hist(t,'王經理',`登錄酒店確認單 ${t.hotel.conf}，保留 ${pts(cov*25000)} 分`); audit('王經理','管理者',`${t.id} 登錄有效住宿 ${t.hotel.conf}`); toast('已登錄有效住宿並保留積分；已建立 T06 任務給 '+t.host); };
ACT.verifyChange=p=>{ const c=S.changeRequests.find(x=>x.id===p.id); const t=trip(c.tripId); c.stage='done'; c.history.push({t:nowStamp(),e:'管理者核對並正式登錄'}); if(c.result.ok!=='no'){ if(c.type==='extend'){ const add=Math.max(1,Math.round((new Date(c.want.cout)-new Date(t.cout))/86400000)); t.hotel.next={conf:c.result.conf,dates:`${t.cout} – ${c.want.cout} · ${add} 晚`}; t.cout=c.want.cout; t.nights+=add; } else if(c.type==='reschedule'&&c.want){ t.cin=c.want.cin; t.cout=c.want.cout; t.nights=Math.max(1,Math.round((new Date(t.cout)-new Date(t.cin))/86400000)); t.hotel.conf=c.result.conf; } t.version++; hist(t,'王經理',`核對天城回報並正式登錄，產生版本 v${t.version}（待玩家確認）`); } else hist(t,'王經理','天城無法辦理，維持原安排'); audit('王經理','管理者',`${c.id} 核對登錄`); toast('已正式登錄；玩家端出現新版本待確認'); };
ACT.verifyCar=p=>{ const t=trip(p.id); t.pickup[p.k].verified=true; audit('王經理','管理者',`${t.id} 核對接送車輛`); toast('已核對，玩家端顯示車輛資訊'); };
ACT.reviewApp=p=>{ const a=S.applications.find(x=>x.id===p.id); a.status=p.r; if(p.r==='need_docs') a.reason='請重新上傳清晰證件照'; audit('王經理','管理者',`${a.id} v${a.version} ${ {approved:'核准',need_docs:'要求補件',rejected:'拒絕'}[p.r]}`); toast({approved:'已核准 v'+a.version+'，等待雙驗證啟用',need_docs:'已要求補件',rejected:'已拒絕'}[p.r]); };
ACT.approveImport=()=>{ const imp=S.pointsImport; imp.status='approved'; imp.approvedAt=nowStamp(); imp.rows.forEach(r=>{ if(r.kind==='miss') return; const m=S.members.find(x=>x.tc===r.tc); if(m) m.ledger+=(r.now-(r.prev||0)); }); audit('王經理','管理者',`${imp.id} 核准整批入帳`); toast('已整批入帳；未配對列留待處理'); };
ACT.openSettlement=p=>{ const t=trip(p.id); const m=member(t.uuid); const red=Math.min(t.nights,Math.floor(m.ledger/25000)); t.settlement={id:'STL-'+t.id.slice(3),version:1,nights:t.nights,redeemed:red,points:red*25000,playerConfirmed:null,venueAligned:null}; S.tasks.push({id:'TSK-'+(1050+S.tasks.length),tpl:'T13',title:'跟進玩家結算',tripId:t.id,uuid:t.uuid,assignee:t.host||'Amy',status:'open',due:TODAY+' 20:00'}); hist(t,'王經理',`開放住宿結算 ${t.settlement.id} v1（兌換 ${red} 晚）`); audit('王經理','管理者',`${t.id} 開放結算`); toast('已開放；玩家端出現待確認結算，並建立 T13 任務'); };
ACT.proposeTransfer=()=>{ const id='TRF-00'+(18+S.transfers.length); S.transfers.unshift({id,customer:sel('tr_c')||S.customers[0].name,from:'現歸屬',to:sel('tr_to')||'David Chen',reason:sel('tr_why')||'',proposedBy:'王經理',t:nowStamp(),status:'proposed'}); audit('王經理','管理者',`提出歸屬轉派 ${id}`); toast('已提出，待 Platform admin 執行'); };
ACT.assignHost=p=>{ const h=S.hostRequests.find(x=>x.id===p.id); h.assignee=sel('hr_'+h.id)||'Amy'; h.status='assigned'; S.tasks.push({id:'TSK-'+(1050+S.tasks.length),tpl:'T01',title:'聯繫客戶',tripId:null,uuid:null,customer:h.customer,assignee:h.assignee,status:'open',due:'2026/09/12 18:00'}); audit('王經理','管理者',`${h.id} 指派 ${h.assignee} 代接待`); toast('已指派 '+h.assignee+'，並建立 T01 任務'); };
ACT.addFollowup=p=>{ const c=S.customers.find(x=>x.id===p.id); const to=sel('fu_to')||'CLARIFYING'; S.followups.push({cust:c.id,t:sel('fu_t')||nowStamp(),by:S.ui.role==='agent'?'David Chen':'王經理',ch:sel('fu_ch')||'LINE',from:c.presale,to,sum:sel('fu_sum')||'',next:sel('fu_next')||'—'}); c.presale=to; c.last=nowStamp().slice(0,10)+' · '+PRESALE[to]; audit(S.ui.role==='agent'?'David Chen':'王經理',S.ui.role==='agent'?'Agent':'管理者',`${c.id} 跟進：${PRESALE[to]}`); S.ui.modal=null; ['fu_sum','fu_next'].forEach(k=>delete S.ui.sel[k]); toast('跟進已儲存'); };
ACT.newLead=()=>{ const id='C-20'+(63+S.customers.length); S.customers.push({id,name:(sel('nl_name')||'新 Lead')+'（Lead L-09'+(41+S.customers.length)+'）',uuid:null,phase:'presale',presale:'UNASSESSED',owner:S.ui.role==='agent'?'David Chen':'王經理',referrer:'—',ownerUntil:'—',rounds:1,last:TODAY+' · 建立 Lead（'+(sel('nl_src')||'官方 LINE')+'）'}); S.ui.modal=null; toast('Lead 已建立'); };
ACT.replyCase=p=>{ const c=S.cases.find(x=>x.id===p.id); c.reply=sel('case_reply')||c.reply; c.status=sel('case_status')||'處理中'; audit('王經理','管理者',`${c.id} 回覆並更新為 ${c.status}`); S.ui.modal=null; toast('已回覆玩家'); };
ACT.newTask=()=>{ const tpl=sel('nt_tpl')||'T06'; const tid=sel('nt_trip')||S.trips[0].id; const t=trip(tid); S.tasks.push({id:'TSK-'+(1050+S.tasks.length),tpl,title:TPL[tpl].name,tripId:tid,uuid:t.uuid,assignee:sel('nt_who')||'Amy',status:'open',due:TODAY+' 18:00'}); S.ui.modal=null; toast('任務已建立並指派'); };
ACT.publishCampaign=p=>{ const c=S.campaigns.find(x=>x.id===p.id); c.status='published'; audit('王經理','管理者',`${c.id} 送審發布（另一授權者核准）`); toast('已發布（示意：已由另一授權者核准）'); };
